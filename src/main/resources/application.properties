# File-backed H2 database for local development. Change this URL to a MySQL URL when switching databases.
spring.datasource.url=jdbc:h2:file:./data/smartlearn;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Keep the development schema aligned with entity changes; use migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Optional browser-based database console at /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
