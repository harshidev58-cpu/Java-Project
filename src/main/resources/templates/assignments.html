<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment Tracker · SmartLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .smartlearn-wrap { overflow-wrap: anywhere; }
    </style>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-4">
    <header class="mb-4">
        <p class="text-primary fw-semibold mb-1">Student work</p>
        <h1 class="h2">Assignment Tracker</h1>
        <p class="text-body-secondary">Assignments from all of your enrolled sections.</p>
    </header>

    <div class="mb-3">
        <label class="form-label fw-semibold" for="statusFilter">Filter by status</label>
        <select id="statusFilter" class="form-select" aria-label="Filter assignments by status">
            <option value="ALL">All statuses</option>
            <option value="PENDING">Pending</option>
            <option value="SUBMITTED">Submitted</option>
            <option value="GRADED">Graded</option>
            <option value="OVERDUE">Overdue</option>
        </select>
    </div>

    <p id="emptyAssignments" class="alert alert-light border" th:if="${#lists.isEmpty(assignments)}">
        There are no assignments in your enrolled sections yet.
    </p>
    <div id="assignmentList" class="vstack gap-2">
        <article class="card shadow-sm assignment-item" th:each="assignment : ${assignments}"
                 th:attr="data-status=${assignment.status}">
            <div class="card-body">
                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
                    <div class="min-w-0">
                        <p class="small text-primary fw-semibold mb-1 smartlearn-wrap"
                           th:text="|${assignment.section.course.code} · ${assignment.section.name}|">Course · section</p>
                        <h2 class="h5 smartlearn-wrap" th:text="${assignment.title}">Assignment title</h2>
                        <p class="text-body-secondary mb-1 smartlearn-wrap" th:text="${assignment.description}">Description</p>
                        <small th:text="|Due ${assignment.dueDate}|">Due date</small>
                    </div>
                    <span class="badge align-self-start text-bg-secondary" th:text="${assignment.status}">Status</span>
                </div>
            </div>
        </article>
    </div>
    <p id="noFilteredAssignments" class="alert alert-light border mt-3 d-none">No assignments match this status.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const statusFilter = document.getElementById('statusFilter');
    const assignmentItems = [...document.querySelectorAll('.assignment-item')];
    const noFilteredAssignments = document.getElementById('noFilteredAssignments');

    statusFilter.addEventListener('change', () => {
        let visibleCount = 0;
        assignmentItems.forEach((item) => {
            const matches = statusFilter.value === 'ALL' || item.dataset.status === statusFilter.value;
            item.classList.toggle('d-none', !matches);
            if (matches) visibleCount += 1;
        });
        noFilteredAssignments.classList.toggle('d-none', visibleCount > 0);
    });
</script>
</body>
</html>
