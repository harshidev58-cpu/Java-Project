<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:if="${student != null}" th:href="@{/dashboard(studentId=${student.id})}">SmartLearn</a>
        <a class="navbar-brand fw-semibold" th:if="${student == null}" th:href="@{/instructor/quiz/1/results}">SmartLearn</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#studentNavbar"
                aria-controls="studentNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="studentNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" th:if="${student != null}">
                    <a class="nav-link" th:href="@{/dashboard(studentId=${student.id})}">Dashboard</a>
                </li>
                <li class="nav-item" th:if="${student != null}">
                    <a class="nav-link" th:href="@{/assignments(studentId=${student.id})}">Assignments</a>
                </li>
                <li class="nav-item" th:if="${student != null}">
                    <a class="nav-link" th:href="@{/quiz/1(studentId=${student.id})}">Sample Quiz</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/instructor/quiz/1/results}">Instructor</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
