<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${quiz.title} · SmartLearn|">Quiz · SmartLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .quiz-wrap { overflow-wrap: anywhere; }
    </style>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <header class="mb-4">
        <p class="text-primary fw-semibold mb-1">Quiz attempt</p>
        <h1 class="h2 quiz-wrap" th:text="${quiz.title}">Quiz title</h1>
        <p class="text-body-secondary quiz-wrap" th:text="${quiz.description}">Quiz description</p>
        <p class="small text-body-secondary mb-0" th:text="|Time limit: ${quiz.durationMinutes} minutes|">Time limit</p>
    </header>

    <div class="d-flex flex-wrap align-items-center gap-2 mb-3" aria-live="polite">
        <span id="saveStatus" class="badge text-bg-success">All changes saved</span>
        <span class="small text-body-secondary">Answers are saved on this device and synced when online.</span>
    </div>

    <form id="quizForm" th:attr="data-attempt-id=${attempt.id},data-initial-answers=${initialAnswersJson}">
        <div class="vstack gap-3">
            <fieldset class="card shadow-sm" th:each="question, questionStat : ${questions}">
                <div class="card-body">
                    <legend class="h5 quiz-wrap">
                        <span class="text-primary me-1" th:text="|${questionStat.count}.|">1.</span>
                        <span th:text="${question.prompt}">Question prompt</span>
                    </legend>
                    <div class="vstack gap-2">
                        <div class="form-check" th:each="option, optionStat : ${question.options}">
                            <input class="form-check-input" type="radio"
                                   th:id="|question-${question.id}-option-${optionStat.index}|"
                                   th:name="|question-${question.id}|"
                                   th:value="${option}"
                                   th:checked="${attempt.answers[question.id] == option}">
                            <label class="form-check-label quiz-wrap"
                                   th:for="|question-${question.id}-option-${optionStat.index}|"
                                   th:text="${option}">Answer option</label>
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
        <button id="submitButton" type="submit" class="btn btn-primary btn-lg mt-4 w-100 w-sm-auto">
            Submit quiz
        </button>
    </form>

    <section id="quizResult" class="card shadow-sm mt-4" aria-live="polite" hidden>
        <div class="card-body">
            <h2 class="h4">Quiz result</h2>
            <p id="scoreText" class="fw-semibold"></p>
            <div id="feedbackList" class="vstack gap-3"></div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (() => {
        const form = document.getElementById('quizForm');
        const attemptId = form.dataset.attemptId;
        const storageKey = `smartlearn.quizAttempt.${attemptId}.answers`;
        const saveStatus = document.getElementById('saveStatus');
        const submitButton = document.getElementById('submitButton');
        const resultPanel = document.getElementById('quizResult');
        const feedbackList = document.getElementById('feedbackList');
        const scoreText = document.getElementById('scoreText');
        let syncTimer;
        let answers = {};

        try {
            answers = JSON.parse(form.dataset.initialAnswers || '{}');
            const localAnswers = localStorage.getItem(storageKey);
            if (localAnswers) answers = { ...answers, ...JSON.parse(localAnswers) };
        } catch (error) {
            answers = {};
            showStatus('Local save unavailable', 'text-bg-warning');
        }

        function showStatus(message, badgeClass) {
            saveStatus.textContent = message;
            saveStatus.className = `badge ${badgeClass}`;
        }

        function restoreRadioSelections() {
            Object.entries(answers).forEach(([questionId, answer]) => {
                const input = form.querySelector(`input[name="question-${questionId}"][value="${CSS.escape(answer)}"]`);
                if (input) input.checked = true;
            });
        }

        function saveLocally() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(answers));
                showStatus(navigator.onLine ? 'Saved on this device' : 'Offline - saved on this device',
                    navigator.onLine ? 'text-bg-secondary' : 'text-bg-warning');
            } catch (error) {
                showStatus('Could not save on this device', 'text-bg-danger');
            }
        }

        async function syncAnswers() {
            if (!navigator.onLine) {
                showStatus('Offline - saved on this device', 'text-bg-warning');
                return;
            }
            try {
                const response = await fetch(`/quiz/${attemptId}/autosave`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(answers)
                });
                if (!response.ok) {
                    if (response.status === 410) {
                        showStatus('Attempt expired or invalid', 'text-bg-danger');
                    } else {
                        showStatus('Offline - saved on this device', 'text-bg-warning');
                    }
                    return;
                }
                showStatus('All changes saved', 'text-bg-success');
            } catch (error) {
                showStatus('Offline - saved on this device', 'text-bg-warning');
            }
        }

        restoreRadioSelections();
        form.addEventListener('change', (event) => {
            if (event.target.matches('input[type="radio"]')) {
                const questionId = event.target.name.replace('question-', '');
                answers[questionId] = event.target.value;
                saveLocally();
            }
        });

        syncTimer = window.setInterval(syncAnswers, 5000);
        window.addEventListener('online', syncAnswers);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            window.clearInterval(syncTimer);
            submitButton.disabled = true;
            try {
                const response = await fetch(`/quiz/${attemptId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(answers)
                });
                if (!response.ok) {
                    submitButton.disabled = false;
                    showStatus(response.status === 410 ? 'Attempt expired or invalid' : 'Offline - saved on this device',
                        response.status === 410 ? 'text-bg-danger' : 'text-bg-warning');
                    return;
                }

                const result = await response.json();
                form.hidden = true;
                resultPanel.hidden = false;
                showStatus('Quiz submitted', 'text-bg-success');
                scoreText.textContent = `Score: ${result.score}% (${result.correctCount} of ${result.totalQuestions} correct)`;

                result.feedback.forEach((item, index) => {
                    const card = document.createElement('article');
                    card.className = `border rounded p-3 ${item.correct ? 'border-success' : 'border-danger'}`;
                    const heading = document.createElement('h3');
                    heading.className = 'h6 quiz-wrap';
                    heading.textContent = `${index + 1}. ${item.prompt}`;
                    const answer = document.createElement('p');
                    answer.className = 'mb-1 quiz-wrap';
                    answer.textContent = item.correct
                        ? `Your answer: ${item.selectedAnswer}`
                        : `Your answer: ${item.selectedAnswer || 'No answer'} · Correct answer: ${item.correctAnswer}`;
                    card.append(heading, answer);
                    if (!item.correct) {
                        const explanation = document.createElement('p');
                        explanation.className = 'mb-0 text-body-secondary quiz-wrap';
                        explanation.textContent = item.explanation;
                        card.append(explanation);
                    }
                    feedbackList.append(card);
                });
            } catch (error) {
                submitButton.disabled = false;
                showStatus('Offline - saved on this device', 'text-bg-warning');
            }
        });
    })();
</script>
</body>
</html>
